<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>प्रमाणपत्र सत्यापन</title>


    <!-- Marathi Font -->

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <div class="page">


        <!-- ================= LOGO ================= -->

        <div class="logo-container">

            <div class="logo-box">

                <div class="logo-text">

                    <div class="logo-green">
                        आपले
                    </div>

                    <div class="logo-orange">
                        सरकार
                    </div>

                </div>

            </div>

        </div>



        <!-- ================= TITLE ================= -->

       <!-- ================= CERTIFICATE TITLE ================= -->

<!-- ================= CERTIFICATE TITLE ================= -->

<div class="title-section">

    <div class="certificate-title">

        <!-- Certificate Icon -->
        <div class="certificate-icon">

            <svg
                width="32"
                height="32"
                viewBox="0 0 44 40"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >

                <!-- Certificate paper -->
                <rect
                    x="3"
                    y="4"
                    width="27"
                    height="29"
                    rx="2"
                    fill="none"
                    stroke="#3F5F9A"
                    stroke-width="2"
                />

                <!-- Inner border -->
                <rect
                    x="7"
                    y="8"
                    width="19"
                    height="21"
                    rx="1"
                    fill="none"
                    stroke="#3F5F9A"
                    stroke-width="1"
                />

                <!-- Text lines -->
                <line
                    x1="10"
                    y1="13"
                    x2="22"
                    y2="13"
                    stroke="#3F5F9A"
                    stroke-width="1.5"
                />

                <line
                    x1="10"
                    y1="17"
                    x2="22"
                    y2="17"
                    stroke="#3F5F9A"
                    stroke-width="1.5"
                />

                <line
                    x1="10"
                    y1="21"
                    x2="18"
                    y2="21"
                    stroke="#3F5F9A"
                    stroke-width="1.5"
                />

                <!-- Certificate seal -->
                <circle
                    cx="30"
                    cy="13"
                    r="7"
                    fill="#ffffff"
                    stroke="#3F5F9A"
                    stroke-width="2"
                />

                <circle
                    cx="30"
                    cy="13"
                    r="4"
                    fill="none"
                    stroke="#3F5F9A"
                    stroke-width="1"
                />

                <!-- Ribbon -->
                <path
                    d="M27 19 L27 31 L31 28 L35 31 L35 19"
                    fill="#ffffff"
                    stroke="#3F5F9A"
                    stroke-width="1.8"
                />

                <line
                    x1="31"
                    y1="20"
                    x2="31"
                    y2="29"
                    stroke="#3F5F9A"
                    stroke-width="1"
                />

            </svg>

        </div>


        <!-- Title Text -->

        <span class="certificate-title-text">
            प्रमाणपत्र (दाखला) सत्यापन
        </span>

    </div>

</div>


        <!-- ================= LOCATION ================= -->

        <div class="subtitle"
             id="location">

            ग्रामपंचायत माहिती

        </div>



        <!-- ================= CERTIFICATE CARD ================= -->

        <div class="certificate-card"
             id="certificateCard">


            <div class="detail-row">

                <span class="label">
                    दाखला क्रमांक -
                </span>

                <span class="value"
                      id="certificateNumber">
                </span>

            </div>



            <div class="detail-row">

                <span class="label">
                    दाखल्याचे नाव -
                </span>

                <span class="value"
                      id="certificateName">
                </span>

            </div>



            <div class="detail-row">

                <div class="label">

                    दाखला मागणी केलेल्या व्यक्तीचे नाव -

                </div>

                <div class="value"
                     id="applicantName">

                </div>

            </div>



            <div class="detail-row">

                <span class="label">
                    ग्रामसेवकाचे नाव -
                </span>

                <span class="value"
                      id="gramsevakName">
                </span>

            </div>



            <div class="detail-row">

                <span class="label">
                    दाखला वितरण दिनांक -
                </span>

                <span class="value"
                      id="issueDate">
                </span>

            </div>


        </div>



        <!-- ================= VERIFICATION MESSAGE ================= -->

        <div class="message"
             id="verificationMessage">

        </div>



        <!-- ================= BACK BUTTON ================= -->

        <div class="button-container">

            <button class="back-btn"
                    onclick="goBack()">

                Back

            </button>

        </div>


    </div>



    <!-- Certificate Static Data -->

    <script src="js/certificates.js"></script>


    <!-- Certificate Logic -->

    <script src="js/certificate.js"></script>


</body>

</html>
