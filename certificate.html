<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>प्रमाणपत्र सत्यापन</title>


    <!-- Marathi Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <div class="page">


        <!-- ==================================================
             LOGO
        =================================================== -->

       <!-- ================= AAPLE SARKAR LOGO ================= -->

<div class="logo-container">

    <svg
        class="aaple-sarkar-logo"
        viewBox="0 0 300 180"
        xmlns="http://www.w3.org/2000/svg"
    >

        <!-- Logo Border -->

        <rect
            x="2"
            y="2"
            width="296"
            height="176"
            fill="white"
            stroke="#6FA77B"
            stroke-width="2"
        />


        <!-- Bottom blue border -->

        <line
            x1="2"
            y1="177"
            x2="298"
            y2="177"
            stroke="#4C7196"
            stroke-width="2"
        />


        <!-- ================= TEXT ================= -->

        <!-- आपले -->

        <text
            x="150"
            y="92"
            text-anchor="middle"
            font-family="Noto Sans Devanagari, Arial, sans-serif"
            font-size="43"
            font-weight="700"
            fill="#168453"
        >
            आपले
        </text>


        <!-- सरकार -->

        <text
            x="150"
            y="137"
            text-anchor="middle"
            font-family="Noto Sans Devanagari, Arial, sans-serif"
            font-size="43"
            font-weight="700"
            fill="#E47C35"
        >
            सरकार
        </text>


        <!-- ================= BUILDING ================= -->

        <!-- Dome -->

        <path
            d="M202 77
               Q215 56 228 77
               Z"
            fill="#E7A13D"
        />


        <!-- Dome top -->

        <circle
            cx="215"
            cy="52"
            r="4"
            fill="#E7A13D"
        />


        <!-- Flag / pole -->

        <line
            x1="215"
            y1="49"
            x2="215"
            y2="42"
            stroke="#E7A13D"
            stroke-width="2"
        />


        <!-- Building -->

        <rect
            x="202"
            y="77"
            width="26"
            height="17"
            fill="#D7D7D7"
        />


        <!-- Building columns -->

        <line
            x1="207"
            y1="78"
            x2="207"
            y2="94"
            stroke="#8C8C8C"
            stroke-width="2"
        />

        <line
            x1="214"
            y1="78"
            x2="214"
            y2="94"
            stroke="#8C8C8C"
            stroke-width="2"
        />

        <line
            x1="221"
            y1="78"
            x2="221"
            y2="94"
            stroke="#8C8C8C"
            stroke-width="2"
        />


        <!-- Green ground -->

        <path
            d="M195 96
               Q215 87 235 96
               Q225 101 195 101
               Z"
            fill="#3E9B67"
        />


        <!-- Orange ground -->

        <path
            d="M195 102
               Q215 96 235 102
               Q225 106 195 106
               Z"
            fill="#E47C35"
        />

    </svg>

</div>


        <!-- ==================================================
             CERTIFICATE TITLE
        =================================================== -->

        <div class="title-section">

            <div class="certificate-title">


                <!-- Certificate Icon -->

                <div class="certificate-icon">

                    <svg
                        width="32"
                        height="32"
                        viewBox="0 0 44 40"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >


                        <!-- Certificate Paper -->

                        <rect
                            x="3"
                            y="4"
                            width="27"
                            height="29"
                            rx="2"
                            fill="none"
                            stroke="#3F5F9A"
                            stroke-width="2"
                        />


                        <!-- Inner Border -->

                        <rect
                            x="7"
                            y="8"
                            width="19"
                            height="21"
                            rx="1"
                            fill="none"
                            stroke="#3F5F9A"
                            stroke-width="1"
                        />


                        <!-- Text Lines -->

                        <line
                            x1="10"
                            y1="13"
                            x2="22"
                            y2="13"
                            stroke="#3F5F9A"
                            stroke-width="1.5"
                        />

                        <line
                            x1="10"
                            y1="17"
                            x2="22"
                            y2="17"
                            stroke="#3F5F9A"
                            stroke-width="1.5"
                        />

                        <line
                            x1="10"
                            y1="21"
                            x2="18"
                            y2="21"
                            stroke="#3F5F9A"
                            stroke-width="1.5"
                        />


                        <!-- Certificate Seal -->

                        <circle
                            cx="30"
                            cy="13"
                            r="7"
                            fill="#ffffff"
                            stroke="#3F5F9A"
                            stroke-width="2"
                        />

                        <circle
                            cx="30"
                            cy="13"
                            r="4"
                            fill="none"
                            stroke="#3F5F9A"
                            stroke-width="1"
                        />


                        <!-- Ribbon -->

                        <path
                            d="M27 19 L27 31 L31 28 L35 31 L35 19"
                            fill="#ffffff"
                            stroke="#3F5F9A"
                            stroke-width="1.8"
                        />


                        <!-- Ribbon Separation -->

                        <line
                            x1="31"
                            y1="20"
                            x2="31"
                            y2="29"
                            stroke="#3F5F9A"
                            stroke-width="1"
                        />

                    </svg>

                </div>



                <!-- Title Text -->

                <span class="certificate-title-text">

                    प्रमाणपत्र (दाखला) सत्यापन

                </span>


            </div>

        </div>



        <!-- ==================================================
             LOCATION
        =================================================== -->

        <div
            class="subtitle"
            id="location"
        >

            ग्रामपंचायत माहिती

        </div>



        <!-- ==================================================
             CERTIFICATE DETAILS
        =================================================== -->

        <div
            class="certificate-card"
            id="certificateCard"
        >


            <!-- Certificate Number -->

            <div class="detail-row">

                <span class="label">
                    दाखला क्रमांक -
                </span>

                <span
                    class="value"
                    id="certificateNumber"
                ></span>

            </div>



            <!-- Certificate Name -->

            <div class="detail-row">

                <span class="label">
                    दाखल्याचे नाव -
                </span>

                <span
                    class="value"
                    id="certificateName"
                ></span>

            </div>



            <!-- Applicant Name -->

            <div class="detail-row">

                <div class="label">

                    दाखला मागणी केलेल्या व्यक्तीचे नाव -

                </div>

                <div
                    class="value"
                    id="applicantName"
                ></div>

            </div>



            <!-- Gramsevak Name -->

            <div class="detail-row">

                <span class="label">
                    ग्रामसेवकाचे नाव -
                </span>

                <span
                    class="value"
                    id="gramsevakName"
                ></span>

            </div>



            <!-- Issue Date -->

            <div class="detail-row">

                <span class="label">
                    दाखला वितरण दिनांक -
                </span>

                <span
                    class="value"
                    id="issueDate"
                ></span>

            </div>


        </div>



        <!-- ==================================================
             VERIFICATION MESSAGE
        =================================================== -->

        <div
            class="message"
            id="verificationMessage"
        ></div>



        <!-- ==================================================
             BACK BUTTON
        =================================================== -->

        <div class="button-container">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >

                Back

            </button>

        </div>


    </div>



    <!-- ==================================================
         JAVASCRIPT
    =================================================== -->

    <!-- Static Certificate Data -->

    <script src="js/certificates.js"></script>


    <!-- Certificate Display Logic -->

    <script src="js/certificate.js"></script>


</body>

</html>
